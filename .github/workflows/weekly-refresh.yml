name: Weekly refresh
# Monday re-read of Oracle's readiness docs (scripts/crawl.py), checked by scripts/weekly_check.py, then build.py.
# Commits data/, dist/ and assets/ to main only when the data changed (data/updates.json other than its 'generated'
# date), then starts the Pages deploy. Refresh only: no newsletter, no posts, no email. GitHub emails the repo owner when
# a run fails, including when the checks find missing Oracle rows (then nothing is published).
on:
  # schedule: added after the workflow_dispatch test run is compared with the box refresh
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: crawl, build and check, upload the results as an artifact, but do not commit or push'
        type: boolean
        default: false
permissions:
  contents: write   # commit the refresh
  actions: write    # start pages.yml (pushes made with GITHUB_TOKEN do not trigger push workflows)
concurrency:
  group: weekly-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # real run a few minutes
    env:
      TZ: Europe/Zurich
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup (paths the scripts expect, pdftoppm for the checklist thumbnail; Chrome is preinstalled)
        run: |
          sudo mkdir -p /workspace/fut-raw /workspace/growth && sudo chown -R "$USER" /workspace
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Crawl Oracle Feature Summaries
        run: python3 scripts/crawl.py
      - name: Check the crawl
        run: python3 scripts/weekly_check.py crawl
      - name: Build
        run: python3 scripts/build.py
      - name: Check the build
        id: check
        run: |
          python3 scripts/weekly_check.py build | tee check.log
          if grep -qx CHANGED check.log; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Downloads and rebuild (only when the data changed)
        if: steps.check.outputs.changed == 'true'
        run: |
          python3 scripts/leadmagnets.py
          python3 scripts/build.py
          python3 scripts/weekly_check.py build
      - name: Summary
        if: always()
        run: |
          { echo "### Weekly refresh $(date +%F) (dry run: $DRY_RUN, data changed: ${{ steps.check.outputs.changed }})"; echo '```'; cat check.log 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-refresh-${{ github.run_id }}
          retention-days: 30
          path: |
            check.log
            data/updates.json
            /workspace/fut-raw/summaries.json
      - name: Commit and push if changed
        if: env.DRY_RUN != 'true' && steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A data dist assets
          if git diff --cached --quiet; then echo "No changes to publish."; exit 0; fi
          git -c user.name=cstath71 -c user.email=227154513+cstath71@users.noreply.github.com commit -q -m "Weekly refresh $(date +%F)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "Pushed weekly refresh $(date +%F)."
          gh workflow run pages.yml --ref main
